name: Generate Git-Koi

on:
  schedule:
    - cron: "5 0 * * *" # Runs daily just after midnight UTC
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/koi.yml"

permissions:
  contents: write

jobs:
  build-koi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Koi
        uses: yalongwastaken/git-koi@v1
        with:
          login: DaneshIV
          body: white        # Options: white, black, asagi, tea, gold, platinum
          output-dir: dist

      - name: Commit updated koi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/koi.gif
          git diff --staged --quiet || git commit -m "chore: update git-koi animation"
          git push
