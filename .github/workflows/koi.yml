name: Generate Git-Koi

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-koi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install git-koi
        run: cargo install git-koi

      - name: Generate Koi GIF
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          git-koi --user DaneshIV --output dist/koi.gif

      - name: Commit updated koi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/koi.gif
          git commit -m "chore: update git-koi animation" || exit 0
          git push
